# Optional shared-host gateway. Enable only when moving the existing ngrok upstream
# from localhost:5000 to 127.0.0.1:5089 has been approved.
# The inventory application and its database remain untouched on port 5000.
server {
    listen 127.0.0.1:5089;
    server_name _;
    client_max_body_size 128k;
    access_log off;

    location = /device-registration {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    location = /device-admin {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    location ^~ /device-admin/ {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    location = /download/device-collector {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    location = /api/device-intake {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    location ^~ /api/device-agent/ {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    location = /download/device-agent {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    location = /collector/health {
        proxy_pass http://127.0.0.1:5088/health;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }
    # Review stays private; use SSH forwarding plus X-Admin-Token.
    location ^~ /api/admin/submissions { return 404; }

    location / {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/milife-forwarding.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $milife_connection_upgrade;
    }
}
