server {
    listen 127.0.0.1:5089 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 128k;

    location = /device-registration {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /device-registration-preview {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /device-admin {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location ^~ /device-admin/ {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /device-admin-preview {
        return 302 /device-admin/preview;
    }

    location ^~ /device-admin-preview/ {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /download/device-collector {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /download/device-agent {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /download/device-agent-preview {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /api/device-intake {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location ^~ /api/device-agent/ {
        proxy_pass http://127.0.0.1:5088;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = /collector/health {
        proxy_pass http://127.0.0.1:5088/health;
        include /etc/nginx/snippets/milife-forwarding.conf;
    }

    location = / { return 302 https://$host/device-registration; }
    location ^~ /api/admin/ { return 404; }
    location / { return 404; }
}
